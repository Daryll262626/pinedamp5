<!DOCTYPE html>
<html>
<head>
    <title>Search for a Value</title>
</head>
<body>
    <h1>Search for a Value</h1>

    <p>Enter array values (separated by commas):</p>
    <input type="text" id="arrayInput">

    <p>Enter value to search:</p>
    <input type="text" id="searchInput">

    <br><br>
    <button onclick="searchValue()">Search</button>

    <h2>Result:</h2>
    <p id="result"></p>

    <script>
        function searchValue() {
            let arrayText = document.getElementById("arrayInput").value;

            let arr = [];
            let currentValue = "";

            for (let i = 0; i < arrayText.length; i++) {
                let ch = arrayText[i];
                if (ch === ",") {
                    arr.push(currentValue.trim());
                    currentValue = "";
                } else {
                    currentValue += ch;
                }
            }
            arr.push(currentValue.trim());

            let searchVal = document.getElementById("searchInput").value.trim();

            let found = false;
            let foundIndex = -1;

            for (let i = 0; i < arr.length; i++) {
                if (arr[i] == searchVal) {
                    found = true;
                    foundIndex = i;
                    break;
                }
            }

            let resultText = "";
            if (found) {
                resultText = 'Value "' + searchVal + '" found at index ' + foundIndex + '.';
            } else {
                resultText = 'Value "' + searchVal + '" does not exist in the array.';
            }

            document.getElementById("result").innerText = resultText;
        }
    </script>
</body>
</html>
